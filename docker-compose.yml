services:
  gpstag:
    image: ghcr.io/s4ndyp/gpstag:latest
    container_name: gpstag
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      # Alleen data persistent; pb_public en pb_migrations komen uit de image.
      - ./pb_data:/pb/pb_data
