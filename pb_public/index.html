<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GPSTag" />
  <title>GPSTag</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="/icons/icon-192.png" alt="" /> GPSTag</div>
    <nav class="tabs">
      <button class="tab active" data-view="send">Doorgeven</button>
      <button class="tab" data-view="map">Kaart</button>
    </nav>
  </header>

  <main>
    <section id="view-send" class="view active">
      <div class="card">
        <label for="user-select">Wie ben je?</label>
        <div class="row">
          <select id="user-select"></select>
          <button id="add-user-btn" class="btn secondary" title="Nieuwe gebruiker">+</button>
        </div>
        <form id="add-user-form" class="row hidden">
          <input id="new-user-name" type="text" placeholder="Naam nieuwe gebruiker" maxlength="100" />
          <button type="submit" class="btn">Opslaan</button>
        </form>
      </div>

      <div class="card center">
        <button id="send-btn" class="btn big">📍 Locatie doorgeven</button>
        <p id="send-status" class="muted"></p>
      </div>

      <div class="card">
        <label class="toggle">
          <input type="checkbox" id="auto-toggle" />
          <span class="switch"></span>
          <span>Automatisch ieder uur doorgeven</span>
        </label>
        <p id="auto-status" class="muted">Werkt alleen zolang de app open is.</p>
      </div>

      <div class="card">
        <h3>Laatste doorgegeven posities</h3>
        <ul id="recent-list" class="list"></ul>
      </div>
    </section>

    <section id="view-map" class="view">
      <div class="map-controls card">
        <div class="presets">
          <button class="chip active" data-hours="12">12 uur</button>
          <button class="chip" data-hours="24">24 uur</button>
          <button class="chip" data-hours="168">7 dagen</button>
          <button class="chip" data-hours="744">31 dagen</button>
          <button class="chip" data-hours="custom">Eigen periode</button>
        </div>
        <div id="custom-range" class="row hidden">
          <label>Van <input type="datetime-local" id="range-from" /></label>
          <label>Tot <input type="datetime-local" id="range-to" /></label>
          <button id="range-apply" class="btn">Toon</button>
        </div>
        <div id="user-filter" class="user-filter"></div>
        <p id="map-status" class="muted"></p>
      </div>
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/js/app.js"></script>
</body>
</html>
